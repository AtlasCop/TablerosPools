<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tablero Piscinas &amp; Spas — Iniciar sesión</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; margin: 0; }
  .bg-hero {
    background-image: linear-gradient(180deg, rgba(6,12,24,.35) 0%, rgba(6,12,24,.55) 55%, rgba(6,12,24,.75) 100%), url('assets/hero-pool-twilight.jpg');
    background-size: cover;
    background-position: center;
  }
  .glass {
    background: rgba(15,23,42,0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .fade-in { animation: fadeIn .5s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  input::placeholder { color: rgba(255,255,255,0.35); }
</style>
</head>
<body class="bg-hero min-h-screen flex items-center justify-center px-4 py-10">

<div class="w-full max-w-sm">

  <div class="text-center mb-6 fade-in">
    <img src="assets/logo.png" alt="Tablero Piscinas & Spas" class="w-20 h-20 mx-auto drop-shadow-lg" />
    <p class="text-white/70 text-sm mt-2">Diseña y comparte instalaciones de piscinas y spas</p>
  </div>

  <div class="glass rounded-2xl shadow-2xl p-6 fade-in text-white">

    <!-- LOGIN -->
    <div id="viewLogin">
      <h2 class="text-base font-semibold mb-4">Iniciar sesión</h2>
      <form id="loginForm" class="space-y-3">
        <div>
          <label class="block text-xs text-white/70 mb-1">Usuario</label>
          <input id="loginUser" type="text" autocomplete="username"
            class="w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-400" placeholder="tu usuario" />
        </div>
        <div>
          <label class="block text-xs text-white/70 mb-1">Contraseña</label>
          <input id="loginPass" type="password" autocomplete="current-password"
            class="w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-400" placeholder="••••••••" />
        </div>
        <p id="loginError" class="hidden text-xs text-red-300"></p>
        <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-white text-sm font-medium rounded-lg py-2.5 transition">Entrar</button>
      </form>
      <div class="flex items-center justify-between mt-4 text-xs">
        <button id="goRecover" class="text-sky-300 hover:text-sky-200">¿Olvidaste tu contraseña?</button>
        <button id="goRegisterFromLogin" class="text-white/50 hover:text-white/80">Crear cuenta</button>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="viewRegister" class="hidden">
      <h2 class="text-base font-semibold mb-1">Crear tu cuenta</h2>
      <p class="text-xs text-white/60 mb-4">Define una pregunta de seguridad: es la única forma de recuperar la contraseña más adelante.</p>
      <form id="registerForm" class="space-y-3">
        <input id="regUser" type="text" autocomplete="username" class="w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-400" placeholder="Usuario" />
        <input id="regPass" type="password" autocomplete="new-password" class="w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-400" placeholder="Contraseña" />
        <input id="regPass2" type="password" autocomplete="new-password" class="w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-400" placeholder="Confirmar contraseña" />
        <input id="regQuestion" type="text" class="w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-400" placeholder="Pregunta de seguridad (ej. ¿nombre de tu primera mascota?)" />
        <input id="regAnswer" type="text" class="w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-400" placeholder="Respuesta" />
        <p id="registerError" class="hidden text-xs text-red-300"></p>
        <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-white text-sm font-medium rounded-lg py-2.5 transition">Crear cuenta</button>
      </form>
      <button id="goLoginFromRegister" class="mt-4 text-xs text-white/50 hover:text-white/80">Ya tengo cuenta</button>
    </div>

    <!-- RECOVER -->
    <div id="viewRecover" class="hidden">
      <h2 class="text-base font-semibold mb-4">Recuperar contraseña</h2>

      <div id="recoverStep1" class="space-y-3">
        <input id="recoverUser" type="text" class="w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-400" placeholder="Tu usuario" />
        <button id="recoverFindBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-white text-sm font-medium rounded-lg py-2.5 transition">Continuar</button>
      </div>

      <div id="recoverStep2" class="hidden space-y-3">
        <p id="recoverQuestionText" class="text-xs text-white/70 bg-white/5 rounded-lg px-3 py-2"></p>
        <input id="recoverAnswer" type="text" class="w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-400" placeholder="Tu respuesta" />
        <input id="recoverNewPass" type="password" autocomplete="new-password" class="w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-400" placeholder="Nueva contraseña" />
        <input id="recoverNewPass2" type="password" autocomplete="new-password" class="w-full rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-400" placeholder="Confirmar nueva contraseña" />
        <button id="recoverResetBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-white text-sm font-medium rounded-lg py-2.5 transition">Restablecer contraseña</button>
      </div>

      <p id="recoverError" class="hidden text-xs text-red-300 mt-3"></p>
      <p id="recoverSuccess" class="hidden text-xs text-emerald-300 mt-3"></p>
      <button id="goLoginFromRecover" class="mt-4 text-xs text-white/50 hover:text-white/80">Volver a iniciar sesión</button>
    </div>

  </div>

  <p class="text-center text-white/40 text-[11px] mt-4 leading-relaxed">
    El acceso se guarda solo en este navegador — no hay servidor ni recuperación por correo.
  </p>
</div>

<script>
const AUTH_KEY = 'tablero_auth_account';
function getAccount() { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch { return null; } }
function setAccount(acc) { localStorage.setItem(AUTH_KEY, JSON.stringify(acc)); }

function showView(name) {
  ['Login', 'Register', 'Recover'].forEach(v => {
    document.getElementById('view' + v).classList.toggle('hidden', v !== name);
  });
}

showView(getAccount() ? 'Login' : 'Register');

document.getElementById('goRecover').addEventListener('click', () => showView('Recover'));
document.getElementById('goRegisterFromLogin').addEventListener('click', () => showView('Register'));
document.getElementById('goLoginFromRegister').addEventListener('click', () => showView('Login'));
document.getElementById('goLoginFromRecover').addEventListener('click', () => showView('Login'));

function goToBoard() {
  sessionStorage.setItem('tablero_session', 'active');
  location.href = 'tablero.html' + location.hash;
}

/* LOGIN */
document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const acc = getAccount();
  const err = document.getElementById('loginError');
  if (!acc || u !== acc.username || p !== acc.password) {
    err.textContent = 'Usuario o contraseña incorrectos.';
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  goToBoard();
});

/* REGISTER */
document.getElementById('registerForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value;
  const p2 = document.getElementById('regPass2').value;
  const q = document.getElementById('regQuestion').value.trim();
  const a = document.getElementById('regAnswer').value.trim();
  const err = document.getElementById('registerError');
  err.classList.add('hidden');
  if (!u || !p || !q || !a) { err.textContent = 'Completa todos los campos.'; err.classList.remove('hidden'); return; }
  if (p !== p2) { err.textContent = 'Las contraseñas no coinciden.'; err.classList.remove('hidden'); return; }
  setAccount({ username: u, password: p, question: q, answer: a });
  goToBoard();
});

/* RECOVER */
document.getElementById('recoverFindBtn').addEventListener('click', () => {
  const u = document.getElementById('recoverUser').value.trim();
  const acc = getAccount();
  const err = document.getElementById('recoverError');
  err.classList.add('hidden');
  if (!acc || u !== acc.username) {
    err.textContent = 'No encontramos ese usuario en este navegador.';
    err.classList.remove('hidden');
    return;
  }
  document.getElementById('recoverQuestionText').textContent = acc.question;
  document.getElementById('recoverStep1').classList.add('hidden');
  document.getElementById('recoverStep2').classList.remove('hidden');
});

document.getElementById('recoverResetBtn').addEventListener('click', () => {
  const acc = getAccount();
  const answer = document.getElementById('recoverAnswer').value.trim();
  const newPass = document.getElementById('recoverNewPass').value;
  const newPass2 = document.getElementById('recoverNewPass2').value;
  const err = document.getElementById('recoverError');
  const ok = document.getElementById('recoverSuccess');
  err.classList.add('hidden');
  ok.classList.add('hidden');
  if (!acc || answer.toLowerCase() !== (acc.answer || '').toLowerCase()) {
    err.textContent = 'La respuesta no coincide.';
    err.classList.remove('hidden');
    return;
  }
  if (!newPass || newPass !== newPass2) {
    err.textContent = 'Las contraseñas nuevas no coinciden.';
    err.classList.remove('hidden');
    return;
  }
  acc.password = newPass;
  setAccount(acc);
  ok.textContent = 'Contraseña actualizada. Ya puedes iniciar sesión.';
  ok.classList.remove('hidden');
  document.getElementById('recoverStep1').classList.remove('hidden');
  document.getElementById('recoverStep2').classList.add('hidden');
  document.getElementById('recoverUser').value = '';
  setTimeout(() => showView('Login'), 1400);
});
</script>
</body>
</html>
